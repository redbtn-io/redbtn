name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_new_package:
        description: Allow publishing when this package has no registry entry
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    env:
      NPM_REGISTRY: https://registry.redbtn.io
      ALLOW_NEW_PACKAGE: ${{ inputs.allow_new_package || 'false' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate to Verdaccio
        env:
          REDBTN_NPM_USER: ${{ secrets.REDBTN_NPM_USER }}
          REDBTN_NPM_PASSWORD: ${{ secrets.REDBTN_NPM_PASSWORD }}
        run: |
          set -eu
          { test -n "${REDBTN_NPM_USER:-}" && test -n "${REDBTN_NPM_PASSWORD:-}"; } || { echo 'REDBTN_NPM_USER / REDBTN_NPM_PASSWORD are not configured' >&2; exit 1; }
          npmrc="$RUNNER_TEMP/redbtn-npmrc"
          umask 077
          {
            printf '@redbtn:registry=%s\n' "$NPM_REGISTRY"
            printf '//registry.redbtn.io/:username=%s\n' "$REDBTN_NPM_USER"
            printf '//registry.redbtn.io/:_password=%s\n' "$(printf '%s' "$REDBTN_NPM_PASSWORD" | base64 -w0)"
            printf 'always-auth=true\n'
          } > "$npmrc"
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"
          NPM_CONFIG_USERCONFIG="$npmrc" npm view @redbtn/redbtn name --registry "$NPM_REGISTRY" >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Publish or skip and reconcile dist-tags
        run: ./scripts/release.sh
