name: CI

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    # The conversation-attribution tests assert on documents that actually land
    # in Mongo, so CI runs a real MongoDB rather than skipping them. Without this
    # the suite would only ever prove itself against mocks.
    services:
      mongodb:
        image: mongo:8
        # Container port only: Docker picks a free host port, so two jobs
        # sharing a self-hosted runner (or a dev Mongo already on 27017) no
        # longer collide with 'Bind for 127.0.0.1:27017 failed'.
        ports:
          - 27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Long-lived BASIC auth (username + base64 `_password`), the same pattern as
      # webapp beta-ci.yml. REDBTN_NPM_PASSWORD holds the unencoded password, so it
      # is base64-encoded here. The old REDBTN_NPM_TOKEN (`_auth`) held the retired
      # redrun-build credential, which the registry now rejects with 401. CI only
      # appeared to work while actions/setup-node restored an npm cache that already
      # held every @redbtn tarball. `npm whoami` is NOT a validity check (Verdaccio
      # answers 200 for any credential), so the step fetches a scoped packument.
      - name: Authenticate to @redbtn registry
        env:
          REDBTN_NPM_USER: ${{ secrets.REDBTN_NPM_USER }}
          REDBTN_NPM_PASSWORD: ${{ secrets.REDBTN_NPM_PASSWORD }}
          NPM_REGISTRY: https://registry.redbtn.io
        run: |
          set -eu
          { test -n "${REDBTN_NPM_USER:-}" && test -n "${REDBTN_NPM_PASSWORD:-}"; } || { echo 'REDBTN_NPM_USER / REDBTN_NPM_PASSWORD are not configured' >&2; exit 1; }
          npmrc="$RUNNER_TEMP/redbtn-npmrc"
          umask 077
          {
            printf '@redbtn:registry=%s\n' "$NPM_REGISTRY"
            printf '//registry.redbtn.io/:username=%s\n' "$REDBTN_NPM_USER"
            printf '//registry.redbtn.io/:_password=%s\n' "$(printf '%s' "$REDBTN_NPM_PASSWORD" | base64 -w0)"
            printf 'always-auth=true\n'
          } > "$npmrc"
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"
          NPM_CONFIG_USERCONFIG="$npmrc" npm view @redbtn/redbtn name --registry "$NPM_REGISTRY" >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, no autofix)
        run: npm run lint:check

      - name: Build
        env:
          MONGODB_URI: mongodb://placeholder/ci
          REDIS_URL: redis://placeholder
          JWT_SECRET: ci-build-placeholder-do-not-use
          NODE_ENV: test
          NEXTAUTH_SECRET: ci-build-placeholder-do-not-use
        run: npm run build

      - name: Test
        env:
          # Points at the MongoDB service container above. Tests that need a real
          # database read MONGODB_TEST_URI first, so they run for real here.
          MONGODB_TEST_URI: mongodb://ci:ci@localhost:${{ job.services.mongodb.ports['27017'] }}/redbtn_test?authSource=admin
          MONGODB_URI: mongodb://placeholder/ci
          REDIS_URL: redis://placeholder
          CHROMA_URL: http://placeholder:9999
          JWT_SECRET: ci-build-placeholder-do-not-use
          NODE_ENV: test
          NEXTAUTH_SECRET: ci-build-placeholder-do-not-use
        run: npm test
